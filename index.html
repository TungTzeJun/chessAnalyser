<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Performance Analyser</title>
    <link rel="stylesheet" href="main_design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,
    wght@0,14..32 ,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        /* ... existing styles ... */
        .analysis-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .analysis-overlay[hidden] {
            display: none !important;
        }

        .analysis-overlay h2 {
            margin-bottom: 20px;
        }

        .progress-container {
            width: 300px;
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>

<body>
    <div id="analysisOverlay" class="analysis-overlay" hidden>
        <h2 id="analysisText">Analyzing Game...</h2>
        <div class="progress-container">
            <div id="analysisProgress" class="progress-bar"></div>
        </div>
    </div>
    <header>
        <h1 class="title"><i>Chess Performance Analyser</i></h1>
    </header>
    <section id="layout">
        <section id="pgnBar">
            <label for="pgnInput">PGN</label>
            <div class="inline-controls">
                <textarea id="pgnInput" rows="6" placeholder="Paste PGN here"></textarea>
                <button id="importPgn">Import PGN</button>
                <div class="engine-settings">
                    <div class="setting-item">
                        <label for="analysisDepth">Depth:</label>
                        <select id="analysisDepth">
                            <option value="10">10 (Fast)</option>
                            <option value="12">12</option>
                            <option value="14">14</option>
                            <option value="16">16</option>
                            <option value="18" selected>18 (Balanced)</option>
                            <option value="20">20</option>
                            <option value="22">22</option>
                            <option value="24">24 (Deep)</option>
                            <option value="26">26</option>
                            <option value="28">28</option>
                            <option value="30">30 (Cloud Quality)</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="analysisThreads">Threads:</label>
                        <select id="analysisThreads">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="4" selected>4</option>
                            <option value="8">8</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="analysisMultiPV">Multi-PV:</label>
                        <select id="analysisMultiPV">
                            <option value="1" selected>1 (Standard)</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="pgnMessage"></div>
        </section>
        <section id="boardSection" class="card" hidden>
            <h2>Board</h2>
            <div class="board-wrapper">
                <div id="board" class="chess-board"></div>
                <div class="board-sidebar">

                </div>
                <div class="eval-bar" id="evalBar">
                    <div class="eval-fill" id="evalFill"></div>
                    <div class="eval-label" id="evalLabel">-</div>
                </div>
            </div>
            <div class="control-bar">
                <button id="firstMove" aria-label="First move">⏮</button>
                <button id="prevMove" aria-label="Previous move">◀</button>
                <button id="nextMove" aria-label="Next move">▶</button>
                <button id="lastMove" aria-label="Last move">⏭</button>
                <span id="moveStatus" class="status"></span>
            </div>
        </section>
        <section id="results">
            <div id="metadata" class="card" hidden>
                <h2>Game Metadata</h2>
                <div class="grid">
                    <div>
                        <div class="label">White</div>
                        <div id="metaWhite" class="value">-</div>
                    </div>
                    <div>
                        <div class="label">Black</div>
                        <div id="metaBlack" class="value">-</div>
                    </div>
                    <div>
                        <div class="label">Result</div>
                        <div id="metaResult" class="value">-</div>
                    </div>
                    <div>
                        <div class="label">Event</div>
                        <div id="metaEvent" class="value">-</div>
                    </div>
                    <div>
                        <div class="label">Date</div>
                        <div id="metaDate" class="value">-</div>
                    </div>
                </div>
            </div>
            <div id="evalGraphCard" class="card">
                <h2>Evaluation</h2>
                <canvas id="evalCanvas" width="720" height="240"></canvas>
            </div>
        </section>
    </section>

    <script src="engine.js?v=7"></script>
</body>

</html>
